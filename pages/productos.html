<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-box me-2" style="color:var(--primary)"></i>Productos</h4>
      <small class="text-muted">Gestión de inventario de productos</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevoProducto">
      <i class="fas fa-plus me-1"></i> Nuevo Producto
    </button>
  </div>

  <!-- Stats Cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="panel-card p-3 text-center">
        <div class="text-muted small">Total Productos</div>
        <div class="h4 mb-0 fw-bold" id="statsTotal">0</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="panel-card p-3 text-center">
        <div class="text-muted small">Stock Global</div>
        <div class="h4 mb-0 fw-bold" id="statsStock">0</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="panel-card p-3 text-center">
        <div class="text-muted small">Productos Activos</div>
        <div class="h4 mb-0 fw-bold" id="statsActivos">0</div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar filter-bar-2cols">
    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-search"></i></span>
      <input type="text" class="form-control" id="searchProducto" placeholder="Buscar por SKU o nombre...">
    </div>
    <div><select class="form-select sucursal-select" id="filterSucursal">
      <option value="">Todas las sucursales</option>
    </select></div>
  </div>

  <!-- Table -->
  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th style="width:50px"></th>
            <th>SKU</th>
            <th>Nombre</th>
            <th>Stock</th>
            <th>Precio</th>
            <th>Estado</th>
            <th style="width:120px"></th>
          </tr>
        </thead>
        <tbody id="tableProductosBody">
          <tr><td colspan="7"><div class="empty-state"><i class="fas fa-box-open"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Pagination -->
  <div class="mt-3" id="paginationProductos"></div>
</div>

<!-- Producto Modal -->
<div class="modal fade" id="productoModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="productoModalTitle">Nuevo Producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formProducto">
          <input type="hidden" id="productoId">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">SKU <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="productoSku" required maxlength="50">
            </div>
            <div class="col-md-8">
              <label class="form-label">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="productoNombre" required maxlength="200">
            </div>
            <div class="col-12">
              <label class="form-label">Descripción</label>
              <textarea class="form-control" id="productoDescripcion" rows="2" maxlength="2000"></textarea>
            </div>
            <div class="col-md-3">
              <label class="form-label">Precio 1</label>
              <input type="number" class="form-control" id="productoPrecio1" step="0.01" min="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Precio 2</label>
              <input type="number" class="form-control" id="productoPrecio2" step="0.01" min="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Precio 3</label>
              <input type="number" class="form-control" id="productoPrecio3" step="0.01" min="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Precio 4</label>
              <input type="number" class="form-control" id="productoPrecio4" step="0.01" min="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Stock Actual</label>
              <input type="number" class="form-control" id="productoStock" min="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Stock Mínimo</label>
              <input type="number" class="form-control" id="productoStockMin" min="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Stock Máximo</label>
              <input type="number" class="form-control" id="productoStockMax" min="0">
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="productoActivo" checked>
                <label class="form-check-label" for="productoActivo">Producto activo</label>
              </div>
            </div>
            <div class="col-12"><hr class="my-1"></div>
            <div class="col-md-4">
              <label class="form-label">Material</label>
              <input type="text" class="form-control" id="productoMaterial" maxlength="100">
            </div>
            <div class="col-md-4">
              <label class="form-label">Número de Molde</label>
              <input type="text" class="form-control" id="productoNumeroMolde" maxlength="50">
            </div>
            <div class="col-md-4">
              <label class="form-label">Talla</label>
              <input type="text" class="form-control" id="productoTalla" maxlength="20">
            </div>
            <div class="col-md-4">
              <label class="form-label">Accesorio 1</label>
              <input type="text" class="form-control" id="productoAccesorio1" maxlength="100">
            </div>
            <div class="col-md-4">
              <label class="form-label">Accesorio 2</label>
              <input type="text" class="form-control" id="productoAccesorio2" maxlength="100">
            </div>
            <div class="col-md-4"></div>
            <div class="col-12" id="productoSucursalRow">
              <label class="form-label">Sucursal (stock inicial)</label>
              <select class="form-select sucursal-stock-select" id="productoSucursal">
                <option value="">Seleccionar sucursal</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarProducto">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Multimedia Modal -->
<div class="modal fade" id="multimediaModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">
          <i class="fas fa-images me-2" style="color:var(--primary)"></i>
          <span id="multimediaProductoName">Producto</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-4">
          <!-- Multimedia -->
          <div class="col-lg-7">
            <h6 class="fw-semibold mb-3"><i class="fas fa-photo-video me-1"></i> Multimedia</h6>
            <div class="media-gallery mb-3" id="multimediaGallery"></div>
            <div class="mt-2">
              <label class="btn btn-outline-primary btn-sm">
                <i class="fas fa-upload me-1"></i> Subir archivo
                <input type="file" id="multimediaInput" accept="image/*,video/*" style="display:none">
              </label>
              <small class="text-muted ms-2">Imágenes o videos</small>
            </div>
          </div>
          <!-- Stock por sucursal -->
          <div class="col-lg-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="fw-semibold mb-0"><i class="fas fa-warehouse me-1"></i> Stock por Sucursal</h6>
              <button class="btn btn-sm btn-outline-primary" id="btnRegistrarMovimiento">
                <i class="fas fa-plus"></i> Movimiento
              </button>
            </div>
            <div id="stockSucursalList"></div>
            <hr>
            <h6 class="fw-semibold mb-2"><i class="fas fa-history me-1"></i> Últimos Movimientos</h6>
            <div id="movimientosRecientes"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Movimiento Modal -->
<div class="modal fade" id="movimientoModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Registrar Movimiento</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="movimientoForm">
          <input type="hidden" id="movimientoProductoId">
          <div class="mb-3">
            <label class="form-label">Tipo de Movimiento</label>
            <select class="form-select" id="movimientoTipo">
              <option value="ENTRADA">Entrada</option>
              <option value="SALIDA">Salida</option>
              <option value="AJUSTE">Ajuste</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control" id="movimientoCantidad" min="1" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Sucursal</label>
            <select class="form-select sucursal-stock-select" id="movimientoSucursal">
              <option value="">Global</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Referencia</label>
            <input type="text" class="form-control" id="movimientoReferencia" placeholder="Factura, nota, etc.">
          </div>
          <div class="mb-3">
            <label class="form-label">Observación</label>
            <textarea class="form-control" id="movimientoObservacion" rows="2"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarMovimiento">Registrar</button>
      </div>
    </div>
  </div>
</div>
